glob_matcher: doublestar

pre-commit:
  commands:
    lint:
      glob: '**/*.{js,ts,json,yaml,md}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true

    typecheck:
      glob: '**/*.ts'
      run: pnpm typecheck

    test:
      glob: 'src/**/*.ts'
      run: pnpm exec vitest related --run --passWithNoTests {staged_files}
